<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body data-page="student-dashboard">
    <div class="dashboard-shell">
      <aside class="sidebar">
        <div class="brand brand-centered">
          <div class="brand-mark">DD</div>
          <div>
            <strong>Portal</strong>
            <small>Student</small>
          </div>
        </div>
        <nav>
          <a href="student-dashboard.html" class="active">Dashboard</a>
          <a href="profile.html">Profile</a>
          <a href="dues.html">Dues</a>
          <a href="payment.html">Payment</a>
          <a href="payment-history.html">History</a>
          <a href="receipt.html">Receipt</a>
          <a href="notifications.html">Notifications</a>
          <a href="complaints.html">Complaints</a>
          <a href="#" data-logout>Logout</a>
        </nav>
      </aside>

      <main class="dashboard-main">
        <div class="topbar">
          <div>
            <span class="eyebrow">Student portal</span>
            <h1>Welcome, <span data-user-name>Student</span></h1>
          </div>
          <div class="topbar-actions">
            <a href="notifications.html" class="notification-badge" data-notifications-link data-count="0">🔔</a>
          </div>
        </div>

        <div data-profile-summary class="summary-layout"></div>

        <div class="section" style="padding: 0;">
          <div data-student-metrics class="metric-grid"></div>
        </div>

        <div class="content-grid">
          <section class="table-card">
            <div class="status-row">
              <h3>Recent payments</h3>
              <a class="link-plain" href="payment-history.html">View all</a>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Purpose</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Date</th>
                  </tr>
                </thead>
                <tbody data-dashboard-transactions></tbody>
              </table>
            </div>
          </section>

          <aside class="table-card">
            <h3>Notifications</h3>
            <div class="list-stack" data-notifications-list></div>
          </aside>
        </div>
      </main>
    </div>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <p>© ProfJames 2026</p>
      </div>
    </footer>

    <script src="js/uenr-academic-structure.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
