<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | Departmental Dues Portal</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body data-page="forgot-password" class="auth-page">
    <div class="auth-shell">
      <div class="auth-card">
        <div class="brand brand-centered">
          <div class="brand-mark">DD</div>
          <div>
            <strong>Departmental Dues</strong>
            <small>Management Portal</small>
          </div>
        </div>

        <div class="card-head">
          <span class="eyebrow">Account recovery</span>
          <h1>Reset password</h1>
        </div>

        <form id="forgotPasswordForm" class="form-grid">
          <div class="field">
            <label for="resetEmail">Email address</label>
            <input id="resetEmail" type="email" placeholder="you@example.com" required />
          </div>
          <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
        </form>

        <div class="auth-meta">
          <p><a href="login.html">Back to login</a></p>
          <p class="demo-note">Demo mode: reset instructions are simulated and displayed in the website notification panel.</p>
        </div>
      </div>
    </div>

    <footer class="site-footer auth-footer">
      <div class="container footer-wrap">
        <p>© ProfJames 2026</p>
      </div>
    </footer>

    <script src="js/uenr-academic-structure.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
